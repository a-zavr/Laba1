<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица космических тел</title>
</head>
<body>

    <header>
        <h1 align = "center">Таблица с космическими телами</h1>
        <nav align = "left">
            <p> 
                <a href = "index.html">Космические тела Солнечной системы</a><br>
                <a href = "table.html">Список космических тел</a>
            </p>
        </nav>
    </header>

    <hr size="1" width="100%" align="center">

    <details open>
        <summary>
            График
        </summary>
        <p><strong>Значение по оси ОX</strong></p>
        <p>
            <label><input type="radio" name="ox" value="object_type"> Тип объекта</label><br>
            <label><input type="radio" name="ox" value="central_body"> Центральное тело</label><br>
            <label><input type="radio" name="ox" value="discovery_year"> Год открытия</label>
        </p>

        <p><strong>Значение по оси ОY</strong></p>
        <p>
            <label><input type="checkbox" name="oy" value="max_diam"> Максимальный диаметр</label><br>
            <label><input type="checkbox" name="oy" value="min_diam"> Минимальный диаметр</label><br>
            <label><input type="checkbox" name="oy" value="cosmic_count"> Количество космических тел</label>
        </p>

        <p><button type="button">Построить</button></p>
        <p>Здесь будет график</p>
    </details>

    <details open>
        <summary>
            Фильтр
        </summary>
        <p><label>Название: <input type="text" name="name"></label></p>
        <p><label>Тип объекта: <input type="text" name="object_type_filter"></label></p>
        <p><label>Центральное тело: <input type="text" name="central_body_filter"></label></p>
        <p><label>Первооткрыватель: <input type="text" name="discoverer"></label></p>
        <p><label>Год открытия: от <input type="text" name="year_from"> до <input type="text" name="year_to"></p>
        <p><label>Диаметр: от <input type="text" name="diameter_from"> до <input type="text" name="diameter_to"></p>
        <p><button type="button">Найти</button></p>
    </details>

    <details open>
        <summary>Сортировка</summary>
        <p>
            <label>Первый уровень: 
            <select name="sortlevel_1">
                <option value="none">Нет</option>
                <option value="name">Название</option>
                <option value="object_type">Тип объекта</option>
                <option value="central_body">Центральное тело</option>
                <option value="discoverer">Первооткрыватель</option>
                <option value="discovery_year">Год открытия</option>
                <option value="diameter">Диаметр</option>
            </select>
            </label>
            <label><input type="checkbox" name="desclevel_1"> по убыванию?</label>
        </p>
        <p>
            <label>Второй уровень: 
            <select name="sortlevel_2">
                <option value="none">Нет</option>
                <option value="name">Название</option>
                <option value="object_type">Тип объекта</option>
                <option value="central_body">Центральное тело</option>
                <option value="discoverer">Первооткрыватель</option>
                <option value="discovery_year">Год открытия</option>
                <option value="diameter">Диаметр</option>
            </select>
            </label>
            <label><input type="checkbox" name="desclevel_2"> по убыванию?</label>
        </p>
        <p>
            <label>Третий уровень: 
            <select name="sortlevel_3">
                <option value="none">Нет</option>
                <option value="name">Название</option>
                <option value="object_type">Тип объекта</option>
                <option value="central_body">Центральное тело</option>
                <option value="discoverer">Первооткрыватель</option>
                <option value="discovery_year">Год открытия</option>
                <option value="diameter">Диаметр</option>
            </select>
            </label>
            <label><input type="checkbox" name="desclevel_3"> по убыванию?</label>
        </p>

        <p><button type="button">Сортировать</button></p>
    </details>

    <footer> 
        <p>
            Алексей Александрович Завражнов. Б9124-09.03.04 (5)
        </p>
    </footer>
</body>
</html>
